name: Talk Assistant Conference packs

# Runs by itself every day from the 4th to the 20th of April and October, a few days after
# General Conference. If there is nothing new, it does nothing. You can also run it yourself:
# Actions tab, "Talk Assistant Conference packs", Run workflow.
on:
  schedule:
    - cron: "0 6 4-20 4,10 *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild every Conference pack from scratch (yes or no)"
        default: "no"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python tools/build_talk_packs.py
        env:
          REBUILD: ${{ github.event.inputs.rebuild == 'yes' && '1' || '0' }}
      - name: Save new packs
        run: |
          git config user.name "talk-packs-bot"
          git config user.email "talk-packs-bot@users.noreply.github.com"
          git add talk
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add new General Conference talk packs"
            git push
          fi
